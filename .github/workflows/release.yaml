name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
            ext: ""
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            ext: ""
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            suffix: darwin-amd64
            ext: ""
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: darwin-arm64
            ext: ""
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-amd64
            ext: ".exe"
            cross: false

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.suffix }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binaries
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --workspace --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../replayer-${{ matrix.suffix }}.tar.gz replayer${{ matrix.ext }}
          tar czf ../../../replayer-cloud-${{ matrix.suffix }}.tar.gz replayer-cloud${{ matrix.ext }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path replayer${{ matrix.ext }} -DestinationPath ../../../replayer-${{ matrix.suffix }}.zip
          Compress-Archive -Path replayer-cloud${{ matrix.ext }} -DestinationPath ../../../replayer-cloud-${{ matrix.suffix }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            replayer-*.tar.gz
            replayer-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            replayer-*.tar.gz
            replayer-*.zip
